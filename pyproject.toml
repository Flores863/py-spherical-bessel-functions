[project]
name = "py-spherical-bessel-functions"
version = "0.1.0"
description = "Computes spherical Bessel functions j_n and y_n for integer orders via floating-point recurrence relations."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
